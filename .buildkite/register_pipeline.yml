# Steps for the `yggdrasil-register` pipeline.
#
# This pipeline is triggered by the main `yggdrasil` pipeline (see
# `trigger_registration_step` in `.buildkite/utils.jl`) once all builds of a
# project have finished.  It is kept separate so that the `GITHUB_TOKEN` secret --
# used to push the JLL packages and create the GitHub releases -- is only
# readable from this trusted pipeline and never from the build steps that run
# (potentially untrusted) `build_tarballs.jl` code.
#
# Set the `yggdrasil-register` pipeline's webUI step to:
#     buildkite-agent pipeline upload .buildkite/register_pipeline.yml
#
# The `NAME`, `PROJECT`, `SKIP_BUILD`, `BUILD_ID` (and the registry/pkg-server)
# environment variables are supplied by the triggering build.
steps:
  # Bound the number of registration builds in flight. The closing step is ordered
  # ahead of later builds' opening steps, so this pair forms a Buildkite concurrency gate.
  - label: ":pipeline: Enter registration gate"
    command: "true"
    concurrency: 3
    concurrency_group: "yggdrasil/register"
    agents:
      queue: "yggdrasil"
      arch: "x86_64"
      os: "linux"

  - wait

  - label: "register -- ${NAME}"
    priority: 10
    agents:
      queue: "yggdrasil"
      arch: "x86_64"
      os: "linux"
      sandbox_capable: "true"
    plugins:
      - JuliaCI/julia#v1:
          persist_depot_dirs: packages,artifacts,compiled
          version: "1.12.4"
      - JuliaCI/merge-commit: ~
    timeout_in_minutes: 90
    # Do not let two builds choose a wrapper version for the same package concurrently.
    concurrency: 1
    concurrency_group: "yggdrasil/register/${NAME}"
    command: .buildkite/register.sh
    secrets:
      - GITHUB_TOKEN
      - REGISTRY_GITHUB_TOKEN

  # Always release the global gate, including after a failed registration.
  - wait: ~
    continue_on_failure: true

  - label: ":pipeline: Leave registration gate"
    command: "true"
    concurrency: 3
    concurrency_group: "yggdrasil/register"
    agents:
      queue: "yggdrasil"
      arch: "x86_64"
      os: "linux"
